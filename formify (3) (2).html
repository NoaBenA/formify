<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Formify · פלטפורמת טפסים מקוונים</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden}
iframe{display:block;width:100%;height:100%;border:0}
</style>
</head>
<body>
<iframe id="formifyApp" src="formify%20(3).html" title="Formify"></iframe>
<script>
const frame=document.getElementById('formifyApp');
frame.addEventListener('load',()=>{
  const win=frame.contentWindow;
  const doc=frame.contentDocument;
  if(!win||!doc) return;

  // Create the sidebar that the original application already defines.
  if(typeof win.renderSidebar==='function') win.renderSidebar();

  // The original code does not bind #menuBtn to toggleMenu.
  doc.addEventListener('click',event=>{
    const menuButton=event.target.closest('#menuBtn');
    if(menuButton){
      if(typeof win.renderSidebar==='function') win.renderSidebar();
      if(typeof win.toggleMenu==='function') win.toggleMenu();
      const sidebar=doc.querySelector('#sidebar');
      menuButton.setAttribute('aria-expanded',String(!!sidebar?.classList.contains('open')));
      return;
    }

    // Close the drawer after choosing “הטפסים שלי” or “טופס חדש”.
    const menuAction=event.target.closest('#sidebar [data-act]');
    if(menuAction){
      closeMenu();
    }
  },true);

  function closeMenu(){
    const sidebar=doc.querySelector('#sidebar');
    const overlay=doc.querySelector('#overlay');
    const menuButton=doc.querySelector('#menuBtn');
    if(sidebar) sidebar.classList.remove('open');
    if(overlay) overlay.classList.remove('show');
    if(menuButton) menuButton.setAttribute('aria-expanded','false');
  }
});
</script>
</body>
</html>
